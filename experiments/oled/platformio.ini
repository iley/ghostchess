; PlatformIO Project Configuration File
;
; Board: Arduino Nano clone (ATmega328P).
; This env assumes the OLD bootloader (57600 baud), which is what most
; cheap CH340-based Nano clones ship with. If uploads fail with a sync /
; timeout error, switch `board` to `nanoatmega328new` (new bootloader,
; 115200 baud) instead.

[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 9600

; WS0010 / OLED-0010 character OLED driver, SPI mode (bit-banged software SPI).
; Vendored under lib/ so the build is self-contained; see that folder's source.
